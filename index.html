<h1>Fitbit to Garmin Sync</h1>
<p>A personal script run by Stephen Webb. It copies his own weigh-ins (weight and body fat %) from his Fitbit scale, through the Google Health API, into his own Garmin Connect account.</p>
<p>It is not a public service and has no other users.</p>
